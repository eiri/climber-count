name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.27"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: climber
          POSTGRES_PASSWORD: test
          POSTGRES_DB: climber_count_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climber -d climber_count_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Run SQLite tests
        run: go test -v ./...
      - name: Run PostgreSQL tests
        env:
          TEST_POSTGRES_URL: postgres://climber:test@localhost:5432/climber_count_test?sslmode=disable
        run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  automerge:
    needs: [govulncheck, test, lint]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Automerge dependabot
        uses: fastify/github-action-merge-dependabot@v3
