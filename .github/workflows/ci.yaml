name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup go 1.26
        uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.26"
          cache-key-prefix: govulncheck
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup go ${{ matrix.go }}
        uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ matrix.go }}
          cache-key-prefix: test-${{ matrix.go }}
      - name: Run tests
        run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup go 1.26
        uses: cloudx-io/setup-go@v1
        with:
          go-version: "1.26"
          cache-key-prefix: lint
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10

  automerge:
    needs: [govulncheck, test, lint]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Automerge dependabot
        uses: fastify/github-action-merge-dependabot@v3
