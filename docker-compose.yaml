services:
  climber-count:
    # build:
    #   context: .
    # image: climber-count:local
    image: ghcr.io/eiri/climber-count:0.1.16
    env_file: ".env"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9117:9117"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./data:/data

  postgres:
    image: postgres:18
    env_file: ".postgres.env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
