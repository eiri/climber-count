[tools]
go = "1.25"

[env]
_.file = { path = ".env", redact = true }

[tasks.default]
description = "Run the app"
run = "mise run climber-count"

[tasks.build]
description = "Build the binary"
env = { CGO_ENABLED = "0" }
run = "go build -o climber-count ./..."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.climber-count]
description = "Build and run the app"
depends = ["build"]
run = "./climber-count"

[tasks.clean]
description = "Clean Go artifacts"
run = "go clean"

[tasks.image]
description = "Build linux/arm64 Docker image"
env = { GOOS = "linux", GOARCH = "arm64" }
run = [
  "go build -o climber-count ./...",
  "docker buildx build -t ghcr.io/eiri/climber-count:latest . --platform=linux/arm64",
]

[tasks.docker-up]
description = "Start Docker Compose services"
run = "docker compose up -d"

[tasks.docker-down]
description = "Stop Docker Compose services"
run = "docker compose down"

[tasks.docker-logs]
description = "Show Docker Compose logs"
run = "docker compose logs"

[tasks.fmt-check]
description = "Check gofmt"
run = '''
files="$(gofmt -l .)"
if [ -n "$files" ]; then
  echo "$files"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run Definition of Done checks"
run = [
  "mise run fmt-check",
  "mise run vet",
  "mise run build",
  "mise run test",
  "mise run lint",
]
