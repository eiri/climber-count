[tools]
go = "1.26"
golangci-lint = "2.10"

[env]
CGO_ENABLED = "0"
_.file = { path = ".env", redact = true }

[tasks.build]
description = "Build the binary"
run = "go build -o climber-count ./..."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt-check]
description = "Check gofmt"
run = '''
files="$(gofmt -l .)"
if [ -n "$files" ]; then
  echo "$files"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run Definition of Done checks"
run = [
  "mise run fmt-check",
  "mise run vet",
  "mise run build",
  "mise run test",
  "mise run lint",
]

[tasks.clean]
description = "Clean Go artifacts"
run = "go clean"

[tasks.climber-count]
description = "Build and run the app"
depends = ["build"]
run = "./climber-count"

[tasks.start]
description = "Start Docker Compose services"
run = "docker compose up -d"

[tasks.start-dev]
description = "Build and start local Docker image"
run = "docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build"

[tasks.stop]
description = "Stop Docker Compose services"
run = "docker compose down"

[tasks.logs]
description = "Show Docker Compose logs"
run = "docker compose logs"

[tasks.top]
description = "Show Docker Compose top"
run = "docker compose top"
